    <title>Mapa Histórico Interativo - Lagoa Vermelha, RS</title>

    <link rel="stylesheet" href="https://unpkg.com" />

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        /* Estilo do painel de controle de transparência */
        .painel-controle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 1000;
            max-width: 280px;
            border: 1px solid #ddd;
        }
        .painel-controle h4 { 
            margin: 0 0 8px 0; 
            color: #333;
            font-size: 16px;
        }
        .painel-controle p {
            margin: 0 0 12px 0;
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }
        .slider { 
            width: 100%; 
            cursor: pointer;
            accent-color: #ff3333;
        }
        /* Estilização customizada dos Popups */
        .leaflet-popup-content-header {
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 5px;
            color: #ff3333;
        }
    </style>
</head>
